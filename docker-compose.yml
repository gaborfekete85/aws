# Local dependencies for integration tests: docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: meeton
      POSTGRES_PASSWORD: meeton
      POSTGRES_DB: catalog
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeton -d catalog"]
      interval: 2s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]
