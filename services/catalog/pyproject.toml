[project]
name = "localbini-catalog"
version = "0.1.0"
requires-python = ">=3.13"
# aiohttp <3.13: aioresponses 0.7.9 (test mocks) does not support 3.13+ ClientResponse yet.
dependencies = ["localbini-shared", "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2", "alembic>=1.14", "geoalchemy2>=0.16", "shapely>=2.0", "aiohttp>=3.12,<3.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]
