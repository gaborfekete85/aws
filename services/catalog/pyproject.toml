[project]
name = "localbini-catalog"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["localbini-shared", "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2", "alembic>=1.14", "geoalchemy2>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]
