name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Personal addresses live in repository variables, never in the repo.
  TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
  TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}

jobs:
  build:
    name: Build Lambda packages
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: scripts/build_all_lambdas.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: dist/*.zip
          retention-days: 7

  dev:
    name: Deploy dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    # One apply per environment at a time; never cancel an apply mid-flight.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    outputs:
      api_endpoint: ${{ steps.out.outputs.api_endpoint }}
      web_url: ${{ steps.out.outputs.web_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: terraform apply (infra + Lambda code)
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve -lock-timeout=300s
      - name: Run Catalog migrations (in-VPC Lambda)
        run: scripts/run_migrations.sh dev
      - uses: oven-sh/setup-bun@v2
      - name: Build and publish web/ to Amplify Hosting
        run: scripts/deploy_web.sh dev
      - id: out
        working-directory: infra/envs/dev
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(terraform output -raw web_url)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
      - name: Post-deploy integration tests (APIs + events on the bus)
        env:
          API_BASE_URL: ${{ steps.out.outputs.api_endpoint }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          BUS_SPY_QUEUE_URL=$(terraform -chdir=infra/envs/dev output -raw bus_spy_queue_url)
          TEST_CLIENT_ID=$(terraform -chdir=infra/envs/dev output -raw test_client_id)
          export BUS_SPY_QUEUE_URL TEST_CLIENT_ID
          uv sync --frozen
          uv run pytest tests/integration -m dev -v --junitxml=integration-results.xml
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-dev-${{ github.run_id }}
          path: integration-results.xml
          retention-days: 14

  e2e-dev:
    name: Playwright journeys against dev
    needs: dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: tests/e2e
      - run: bunx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Critical journeys (login, search, organizer, free + paid Booking)
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: ${{ needs.dev.outputs.web_url }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: bunx playwright test --grep @dev
      - name: Upload traces, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-dev-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14

  prod:
    name: Deploy prod
    needs: [build, dev, e2e-dev]
    runs-on: ubuntu-latest
    environment: prod   # required reviewer configured on the GitHub Environment
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: terraform apply
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve -lock-timeout=300s
      - name: Run Catalog migrations (in-VPC Lambda)
        run: scripts/run_migrations.sh prod
      - uses: oven-sh/setup-bun@v2
      - name: Build and publish web/ to Amplify Hosting
        run: scripts/deploy_web.sh prod
