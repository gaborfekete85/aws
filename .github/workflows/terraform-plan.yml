name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/**"
      - "scripts/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write        # OIDC to AWS (plan role)
  pull-requests: write   # post the plan

env:
  TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
  TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}
  TF_VAR_external_db_host: ${{ secrets.DEV_EXTERNAL_DB_HOST }}
  TF_VAR_external_db_security_group_id: ${{ secrets.DEV_EXTERNAL_DB_SG_ID }}

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan ${{ matrix.env }}
    # Skipped until infra/bootstrap is applied and the role variable is set.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: scripts/build_all_lambdas.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - name: init
        run: terraform -chdir=infra/envs/${{ matrix.env }} init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        id: plan
        run: |
          set +e
          terraform -chdir=infra/envs/${{ matrix.env }} plan -input=false -no-color -lock-timeout=120s -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- tf-plan-${env} -->`;
            let plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : 'no output';
            if (plan.length > 60000) plan = '…(truncated)…\n' + plan.slice(-60000);
            const summary = (plan.match(/^Plan: .*$/m) || plan.match(/^No changes\..*$/m) || ['see log'])[0];
            const body = `${marker}\n### Terraform plan: \`${env}\` (${process.env.OUTCOME})\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
